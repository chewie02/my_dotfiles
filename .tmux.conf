set-option -a terminal-features 'screen-256color:RGB'
# set-option -sa terminal-ovverrides ',xfce-terminal:RGB'

# Setze C-a als Prefix (einleitungskommando)
set -g prefix C-a
# Entlasse C-b als Prefix
unbind-key C-b
# setting the delay between prefix and command
set -s escape-time 1
# set the base index for windows to 1 instead of 0
#### set -g base-index 1
# set the base index for panes to 1 instead of 0
#### setw -g pane-base-index 1

# shortcut/keybinding 'C-r' --> lade die config neu
bind r source-file ~/.tmux.conf
# reload the file with prefix r
bind r source-file ~/.tmux.conf \; display 'Reloaded!'
# ensure that C-a can be sent to other apps
bind C-a send-prefix

# splitting panes with | and -
bind | split-window -h
bind - split-window -v

# moving between panes with prefix h,j,k,l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# quick window selection
bind -r C-h select-window -t:-
bind -r C-l select-window -t:+

# größen von panes ändern
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# mouse support - setze auf 'on' zum einschalten
set -g mouse off

# Angepasstes Farbschema, wie in anderen Programmen nutzen/ set default temrinal mode to 256color mode 
set -g default-terminal 'screen-256color' 

# set the status line's colors
set -g status-style fg=white,bold,bright,bg=black

# für die hintergrundfenster: set the color of the window list
setw -g window-status-style fg=cyan,bg=black,default

# für das aktive fenster:  set colors for the active window
setw -g window-status-current-style fg=colour250,bold,bright,bg=colour88

# colors for pane borders
setw -g pane-border-style fg=green,bg=black
setw -g pane-active-border-style fg=white,bg=yellow

# active pane normal, other shaded out
setw -g window-style fg=colour248,bg=colour235
setw -g window-active-style fg=colour255,bg=colour237

# command / message line
set -g message-style fg=white,bold,bg=colour23

# anpassungen statuszeile 
# status line left side to show session:window:pane
# links:
set -g status-left-length 40
set -g status-left '#[fg=green]Session:#S #[fg=yellow]Window:#I #[fg=cyan]Pane:#P '

# rechts:
set -g status-right '#[fg=cyan]%d %b %R'

# center the window list in the status line
set -g status-justify centre

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on
# setw -g window-status-activity-style '#[fg=red]'

# enable vi keys
set -g mode-keys vi

# Remap copy paste kommandos in copymode
# (orgi.: leertaste, enter

bind Escape copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
unbind p
bind p paste-buffer

# prefix Ctrl-C takes whatś in the buffer and sends it to system clipboard
# via xclip
bind C-c run 'tmux save-buffer - | xclip -sel clip -i'

# y in copy mode takes selection and sends it to system clipboard via xlip
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -sel clip -i'

# prefix Ctrl-v fills tmux buffer from system clipboard via xlip, then
# pastes from buffer into tmux window
bind C-v run "tmux set-buffer \"$(xclip -sel clip -o)\"; tmux paste-buffer"

# cheat.sh https://youtu.be/hJzqEAf2U4I //primeagen
bind-key -r i run-shell "tmux neww ~/Dokumente/programming/bash/cheat.sh"

# vim einstellung
set-option -g focus-events on

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# erstelle und entferne sessions
bind S command-prompt -p "New Sesssion:" "new-session -A -s '%%'"
bind K confirm kill-session

# List of plugins:: tpm ist der name des plugin-managers
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'AngryMorrocoy/tmux-neolazygit'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
